apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralguard
  namespace: neuralguard
  labels:
    app.kubernetes.io/name: neuralguard
    app.kubernetes.io/part-of: neuralguard-appliance
spec:
  # Roll pods one at a time — sessions/limits live in redis+postgres, but a
  # rolling surge still doubles capacity mid-update; RollingUpdate with
  # maxSurge 1 is fine and keeps availability.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neuralguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuralguard
        app.kubernetes.io/part-of: neuralguard-appliance
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neuralguard
          # Build + push to YOUR registry first — this project ships a
          # Dockerfile, not a published image (see deploy/kubernetes/README.md).
          image: ghcr.io/aiagentmackenzie-lang/neuralguard:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: neuralguard-config
          env:
            - name: NEURALGUARD_AUTH_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: neuralguard-secrets
                  key: api-keys
            - name: NEURALGUARD_CANARY_ENABLED
              value: "true"
            - name: NEURALGUARD_CANARY_SECRET
              valueFrom:
                secretKeyRef:
                  name: neuralguard-secrets
                  key: canary-secret
            - name: NEURALGUARD_AUTH_JWT_ENABLED
              valueFrom:
                secretKeyRef:
                  name: neuralguard-secrets
                  key: jwt-enabled
            - name: NEURALGUARD_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: neuralguard-secrets
                  key: jwt-secret
            # Ed25519 audit signing (P2-10) — set on the pod so every replica
            # signs with the same epoch key.
            - name: NEURALGUARD_AUDIT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: neuralguard-secrets
                  key: audit-signing-key
            - name: NEURALGUARD_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neuralguard-secrets
                  key: postgres-password
            # K8s $(VAR) interpolation resolves from env defined EARLIER in
            # this same list — the password ref above is deliberately first.
            - name: NEURALGUARD_AUDIT_POSTGRES_URL
              value: "postgresql+asyncpg://neuralguard:$(NEURALGUARD_POSTGRES_PASSWORD)@postgres:5432/neuralguard"
          readinessProbe:
            # P1-3 readiness: dependency-aware (refuses ready when a required
            # backend is unreachable).
            httpGet:
              path: /v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: audit-fallback
              mountPath: /data/audit
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        # Audit JSONL OVERFLOW only (bounded in-flight writes spill here when
        # postgres lags). Best-effort by design; the durable store is postgres.
        - name: audit-fallback
          emptyDir: {}