# Non-secret configuration. Secrets (API keys, canary secret, audit signing
# key, JWT secret, postgres password) live in secret.example.yaml → secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: neuralguard-config
  namespace: neuralguard
  labels:
    app.kubernetes.io/name: neuralguard
    app.kubernetes.io/part-of: neuralguard-appliance
data:
  # ── Posture ──
  NEURALGUARD_ENVIRONMENT: "production"
  NEURALGUARD_LOG_LEVEL: "INFO"
  # Behind a Service/Ingress TLS terminates upstream; the pod serves plain
  # HTTP on the cluster-internal network only. Never expose this port to the
  # internet without TLS in front (docs/runbooks/tls_termination.md).
  NEURALGUARD_ALLOW_INSECURE_HTTP: "true"
  NEURALGUARD_MAX_REQUEST_BODY_BYTES: "1048576"
  # ── Auth ── (keys + jwt secret injected from Secret)
  NEURALGUARD_AUTH_ENABLED: "true"
  NEURALGUARD_AUTH_ENFORCE_TENANT_FROM_KEY: "true"
  # Kubelet readiness probes cannot send an API key. /v1/ready is auth-gated
  # by default (and 401s every probe, so the pod never goes Ready —
  # drill-found); the route docstring documents this exact opt-in. /v1/info
  # and /v1/metrics stay auth-gated.
  NEURALGUARD_AUTH_PUBLIC_ENDPOINTS: '["/v1/health","/v1/ready"]'
  # Runtime key rotation: NOT enabled here on purpose — multi-replica
  # rotation needs a shared durable keys file (RWX volume). Env/redeploy is
  # the documented multi-worker rotation path (P2-4); the rotate endpoint
  # refuses runtime-only rotation in production.
  # ── Detection layers ──
  # Structural + Pattern are mandatory. Semantic requires the ONNX model:
  # bake models/ into a custom image or mount a PV at /app/models and set
  # NEURALGUARD_SCANNER_SEMANTIC_ENABLED=true (models are gitignored — the
  # stock image ships with semantic OFF rather than pretending it's on).
  # NOTE: the NEURALGUARD_SCANNER_* names are the real settings surface —
  # compose-style bridge names (SEMANTIC_ENABLED, JUDGE_ENABLED, JUDGE_*) map
  # to no settings field and silently do nothing inside a pod.
  NEURALGUARD_SCANNER_SEMANTIC_ENABLED: "false"
  NEURALGUARD_SCANNER_JUDGE_ENABLED: "false"
  # Point the judge at an Ollama you operate, e.g. an in-cluster Ollama
  # service or a host daemon via the cluster's egress policy. Fill in and
  # set NEURALGUARD_SCANNER_JUDGE_ENABLED=true to use:
  # NEURALGUARD_SCANNER_JUDGE_OLLAMA_URL: "http://ollama.neuralguard.svc.cluster.local:11434"
  # NEURALGUARD_SCANNER_JUDGE_MODEL: "mistral:7b"
  # NEURALGUARD_SCANNER_JUDGE_TIMEOUT_SECONDS: "10"
  # ── Agent Guardian (F4: shared state via redis) ──
  # NEURALGUARD_AGENT_GUARDIAN_REDIS_URL and NEURALGUARD_RATELIMIT_REDIS_URL
  # are set on the Deployment (they embed the redis credential from the
  # Secret — non-secret config lives here, credentials do not).
  NEURALGUARD_AGENT_GUARDIAN_ENABLED: "true"
  NEURALGUARD_AGENT_GUARDIAN_BACKEND: "redis"
  # ── Rate limiting (shared across replicas via redis) ──
  NEURALGUARD_RATELIMIT_ENABLED: "true"
  NEURALGUARD_RATELIMIT_BACKEND: "redis"
  NEURALGUARD_RATELIMIT_REQUESTS_PER_MINUTE: "120"
  NEURALGUARD_RATELIMIT_BURST_SIZE: "20"
  # ── Audit ── (postgres backend; password from Secret)
  NEURALGUARD_AUDIT_BACKEND: "postgres"
  NEURALGUARD_AUDIT_JSONL_PATH: "/data/audit"
  # ── MCP human-in-the-loop (NG-15) — off by default ──
  # These manifests run replicas >= 2, so the HITL store MUST be shared: the
  # in-memory broker is per worker, and an escalation raised on one pod would
  # never reach an approver whose request lands on another. Production refuses
  # the memory store only when SERVER_WORKERS > 1, which cannot see replicas —
  # so this is an operator obligation, not something the app can enforce.
  # NEURALGUARD_MCP_HITL_ENABLED: "true"
  # NEURALGUARD_MCP_HITL_STORE: "redis"
  # NEURALGUARD_MCP_HITL_APPROVER_TENANTS: "admin"
  # The URL embeds the redis credential, so it belongs in the Deployment env
  # (built from the Secret like NEURALGUARD_AUDIT_POSTGRES_URL), NOT here —
  # envFrom does not expand $(VAR), so a URL written here would be literal.
  #   - name: NEURALGUARD_MCP_HITL_REDIS_URL
  #     value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
  # IF YOU ADD IT FROM AN OVERLAY instead: a strategic-merge patch inserts its
  # env list BEFORE this container's env, so $(REDIS_PASSWORD) would be defined
  # *after* its consumer and stay literal (drill-found 2026-11-17: it became the
  # Redis username). Put the whole URL in the Secret and use secretKeyRef:
  #   - name: NEURALGUARD_MCP_HITL_REDIS_URL
  #     valueFrom:
  #       secretKeyRef: { name: neuralguard-secrets, key: hitl-redis-url }
  # Verify the choice from the running pods, not the manifest:
  #   kubectl exec deploy/neuralguard -- \
  #     curl -s -H "Authorization: Bearer $KEY" localhost:8000/v1/info
  #   → mcp_gateway.hitl: {store, shared_across_workers, store_id}
  # Two pods with the same store_id share a store; `shared_across_workers:false`
  # is a per-worker store, which is wrong behind a Service however it booted."
  # ── SIEM routing (P2-7) — off by default; see SiemSettings for all knobs ──
  # NEURALGUARD_SIEM_ENABLED: "true"
  # NEURALGUARD_SIEM_SCARLETAI_URL: "http://scarletai-api.other-namespace.svc:8000"