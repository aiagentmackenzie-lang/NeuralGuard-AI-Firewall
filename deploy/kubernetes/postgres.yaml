# Postgres — durable audit-event backend (NEURALGUARD_AUDIT_BACKEND=postgres).
# The audit chain (P1-4) + Ed25519 signing (P2-10) live HERE, so this is the
# stateful piece. Single-replica StatefulSet with a PVC.
#
# NOTE: postgres:16-alpine runs as uid 70 (the image's `postgres` user) —
# the securityContext below pins exactly that.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: neuralguard
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: neuralguard-appliance
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      # postgres:16-alpine's entrypoint starts as root, chowns/chmods PGDATA,
      # then drops to uid 70. With allowPrivilegeEscalation:false + caps
      # dropped (correct), that drop fails and the container crash-loops with
      # "chmod: /var/run/postgresql: Operation not permitted". Run AS uid/gid 70
      # from the start (verified from the published image) and let fsGroup own
      # the PVC mount.
      # Kubernetes injects every Service as <NAME>_<PORT> env (here
      # NEURALGUARD_PORT=tcp://...), which collides with the app's own
      # NEURALGUARD_PORT setting and crashes boot (drill-found). Also stops
      # cluster topology leaking into the container env.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: neuralguard
            - name: POSTGRES_USER
              value: neuralguard
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neuralguard-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "neuralguard", "-d", "neuralguard"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "neuralguard", "-d", "neuralguard"]
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            # The entrypoint chmods /var/run/postgresql; as uid 70 that fails
            # on the image's root-owned path (drill-found). Give it a tmpfs it
            # owns.
            - name: pg-run
              mountPath: /var/run/postgresql
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: pg-run
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: neuralguard
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None  # headless: StatefulSet identity
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres