# Postgres — durable audit-event backend (NEURALGUARD_AUDIT_BACKEND=postgres).
# The audit chain (P1-4) + Ed25519 signing (P2-10) live HERE, so this is the
# stateful piece. Single-replica StatefulSet with a PVC.
#
# NOTE: postgres:16-alpine runs as uid 70 (the image's `postgres` user) —
# the securityContext below pins exactly that.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: neuralguard
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: neuralguard-appliance
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: neuralguard
            - name: POSTGRES_USER
              value: neuralguard
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neuralguard-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "neuralguard", "-d", "neuralguard"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "neuralguard", "-d", "neuralguard"]
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: neuralguard
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None  # headless: StatefulSet identity
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres