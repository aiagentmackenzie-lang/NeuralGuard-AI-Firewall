# TEMPLATE ONLY — not applied by kustomization. Copy to secret.yaml, fill in
# REAL generated values, apply explicitly, then keep secret.yaml out of git.
#
#   cp secret.example.yaml secret.yaml   # + fill in
#   kubectl apply -f secret.yaml -n neuralguard
#
# Generate values:
#   api keys:        openssl rand -hex 24        # "ng_<hex>|default" format
#   canary secret:   openssl rand -hex 32        # >=32 chars enforced
#   jwt secret:      openssl rand -hex 32        # >=32 chars enforced (if jwt_enabled)
#   signing key:     openssl rand -hex 32        # EXACTLY 32 bytes hex (Ed25519 seed)
#   pg password:     openssl rand -hex 16
apiVersion: v1
kind: Secret
metadata:
  name: neuralguard-secrets
  namespace: neuralguard
  labels:
    app.kubernetes.io/name: neuralguard
    app.kubernetes.io/part-of: neuralguard-appliance
type: Opaque
stringData:
  # "key|tenant" pairs, pipe-separated for multiple keys.
  api-keys: "ng_CHANGE_ME_GENERATE_ME|default"
  canary-secret: "CHANGE_ME_MUST_BE_AT_LEAST_32_CHARACTERS"
  # JWT judge-side auth — only needed if NEURALGUARD_AUTH_JWT_ENABLED=true.
  jwt-enabled: "false"
  jwt-secret: "CHANGE_ME_MUST_BE_AT_LEAST_32_CHARACTERS"
  # Ed25519 seed for audit-event signing (P2-10): 64 hex chars = 32 bytes.
  audit-signing-key: "CHANGE_ME_64_HEX_CHARS_FOR_32_BYTE_SEED"
  postgres-password: "CHANGE_ME"