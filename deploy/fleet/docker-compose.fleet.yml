# Fleet deployment (GAP-3 closure): NeuralGuard + SecurityScarletAI in ONE
# compose project — a single `up` for the co-resident posture.
#
#   cd deploy/fleet
#   cp fleet.env.example .env   # fill in the generated secrets
#   docker compose -f docker-compose.fleet.yml up -d
#
# The include pulls ScarletAI's own compose file UNCHANGED from the sibling
# checkout (this repo and SecurityScarletAI must sit side by side — the
# default checkout layout). Compose resolves the included file's relative
# paths against ITS location, so Scarlet's builds and mounts work unchanged.
# All services then share one compose network and reach each other by
# SERVICE name: Scarlet's API is `api:8000`, its MCP server `mcp:8002`.
#
# Wiring (the whole point of this file):
# - SIEM: every NeuralGuard verdict (hash-chained audit event + companion
#   events) → Scarlet's ingest endpoint, authenticated with the SAME
#   INGEST_BEARER_TOKEN Scarlet verifies on its side.
# - MCP gateway: NeuralGuard's /v1/mcp fronts Scarlet's MCP server
#   (investigate / hunt / explain) with the Wave-2 server-side bearer auth
#   (NEURALGUARD_MCP_UPSTREAM_AUTH_TOKEN = MCP_BEARER_TOKEN).
# - Judge + proxy: HOST Ollama via host.docker.internal (the same instance
#   Scarlet's containers use).
#
# Deliberate fleet posture (documented in docs/runbooks/fleet_deployment.md):
# - NeuralGuard runs WITHOUT its own postgres/redis: JSONL hash-chained audit
#   + memory rate limiting (single worker). Scarlet's stack brings the SIEM's
#   durable stores; NG's audit chain rides to Scarlet inside every event.
# - NeuralGuard serves on ${NG_FLEET_PORT:-8100} — Scarlet publishes :8000,
#   so the standalone NG port would collide.
# - Scarlet publishes host ports (8000/8002/8501/6379/5433) as its compose
#   defines them; container_name pins (scarletai-*) mean the standalone
#   Scarlet stack must NOT run at the same time as this fleet file.

include:
  - ../../../SecurityScarletAI/docker-compose.yml

services:
  neuralguard:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${NG_FLEET_PORT:-8100}:8000"
    environment:
      - NEURALGUARD_ENVIRONMENT=${NEURALGUARD_ENVIRONMENT:-production}
      - NEURALGUARD_LOG_LEVEL=${NEURALGUARD_LOG_LEVEL:-INFO}
      - NEURALGUARD_AUTH_ENABLED=true
      - NEURALGUARD_AUTH_API_KEYS=${NEURALGUARD_AUTH_API_KEYS:?set NEURALGUARD_AUTH_API_KEYS in deploy/fleet/.env}
      - NEURALGUARD_ALLOW_INSECURE_HTTP=true
      - NEURALGUARD_MAX_REQUEST_BODY_BYTES=${NEURALGUARD_MAX_REQUEST_BODY_BYTES:-1048576}
      - NEURALGUARD_CANARY_SECRET=${NEURALGUARD_CANARY_SECRET:?set NEURALGUARD_CANARY_SECRET in deploy/fleet/.env}
      # ── Fleet SIEM wiring (P2-7 + the Wave-1 companion contract) ──
      - NEURALGUARD_SIEM_ENABLED=true
      - NEURALGUARD_SIEM_SCARLETAI_URL=http://api:8000/api/v1/ingest
      - NEURALGUARD_SIEM_SCARLETAI_TOKEN=${INGEST_BEARER_TOKEN:?set INGEST_BEARER_TOKEN in deploy/fleet/.env}
      - NEURALGUARD_SIEM_SCARLETAI_HOST=${NEURALGUARD_SIEM_SCARLETAI_HOST:-neuralguard-fleet}
      # ── MCP gateway → Scarlet's MCP server (Wave-2 upstream auth) ──
      - NEURALGUARD_MCP_ENABLED=true
      - NEURALGUARD_MCP_UPSTREAM_URL=${NEURALGUARD_MCP_UPSTREAM_URL:-http://mcp:8002/mcp}
      - NEURALGUARD_MCP_UPSTREAM_AUTH_TOKEN=${MCP_BEARER_TOKEN:?set MCP_BEARER_TOKEN in deploy/fleet/.env}
      - NEURALGUARD_MCP_HEADERS_REQUIRED=true
      # ── Detection layers (full production stack) ──
      # Semantic: the ONNX models are MOUNTED from the repo checkout
      # (models/ is a gitignored build artifact — never baked). The image
      # carries the semantic runtime (Dockerfile --extra semantic); a
      # deployment without the mount degrades gracefully (readiness
      # reports degraded, detection stays deterministic).
      - NEURALGUARD_SCANNER_SEMANTIC_ENABLED=${SEMANTIC_ENABLED:-true}
      # Agent Guardian (multi-turn detection): memory backend is correct for
      # the fleet's single worker (redis-backed AG needs a shared store).
      - NEURALGUARD_AGENT_GUARDIAN_ENABLED=${AGENT_GUARDIAN_ENABLED:-true}
      - NEURALGUARD_AGENT_GUARDIAN_BACKEND=memory
      # Canary (system-prompt exfiltration detection): secret pinned above;
      # the layer is operational in the fleet posture.
      - NEURALGUARD_CANARY_ENABLED=${CANARY_ENABLED:-true}
      # ── Judge + proxy at HOST Ollama (the same instance Scarlet uses) ──
      - NEURALGUARD_SCANNER_JUDGE_ENABLED=${JUDGE_ENABLED:-true}
      - NEURALGUARD_SCANNER_JUDGE_MODEL=${JUDGE_MODEL:-mistral:7b}
      - NEURALGUARD_SCANNER_JUDGE_OLLAMA_URL=http://host.docker.internal:11434
      - NEURALGUARD_SCANNER_JUDGE_TIMEOUT_SECONDS=${JUDGE_TIMEOUT_SECONDS:-10}
      - NEURALGUARD_PROXY_ENABLED=${PROXY_ENABLED:-true}
      - NEURALGUARD_PROXY_UPSTREAM_URL=${NEURALGUARD_PROXY_UPSTREAM_URL:-http://host.docker.internal:11434/v1}
      - NEURALGUARD_PROXY_UPSTREAM_API_KEY=${NEURALGUARD_PROXY_UPSTREAM_API_KEY:-}
      - NEURALGUARD_PROXY_TIMEOUT_SECONDS=120
      # ── Fleet posture: single worker, JSONL hash-chained audit, memory rate limit ──
      # (Scarlet's stack carries the durable stores; NG's audit chain rides
      # to Scarlet inside raw_data of every routed event.)
      - NEURALGUARD_AUDIT_BACKEND=jsonl
      - NEURALGUARD_AUDIT_JSONL_PATH=/data/audit
      - NEURALGUARD_RATELIMIT_ENABLED=true
      - NEURALGUARD_RATELIMIT_BACKEND=memory
      - NEURALGUARD_RATELIMIT_REQUESTS_PER_MINUTE=${NEURALGUARD_RATELIMIT_REQUESTS_PER_MINUTE:-60}
    volumes:
      - ng_fleet_audit:/data/audit
      # The semantic layer's ONNX model + tokenizer (repo build artifacts).
      - ../../models:/app/models:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Measured 742 MiB with the FULL stack (semantic ONNX + judge
          # plumbing + AG); 1.5 GiB = measured + ~2× headroom under load.
          memory: 1536m
          cpus: "2.0"
        reservations:
          memory: 256m

  # ── NeuralStrike (the offensive third) — PROFILE-GATED, one-shot ──
  # `up -d` brings ONLY the 6 production containers (Scarlet's 5 + NG) —
  # this service exists under the `bench` profile and runs ONE exercise at
  # a time via `docker compose run --rm neuralstrike <cmd>` (the same
  # pattern NeuralStrike's own compose uses). Built from the SIBLING
  # checkout (../../.. = the Security Apps parent dir), like the include
  # above builds from the Scarlet sibling.
  #
  # Wiring (shared ONCE in fleet .env, never duplicated):
  # - screen:  http://neuralguard:8000 (the fleet NG service, in-network)
  #     + NEURALSTRIKE_NEURALGUARD_API_KEY = NEURALGUARD_AUTH_API_KEYS
  #       verbatim — the documented '<key>|<tenant>' form is split by the
  #       bench (resolve_neuralguard_credential); the tenant part matches
  #       the key binding (NG 403s a mismatch).
  # - ingest:  NEURALSTRIKE_SCARLETAI_URL = Scarlet's ingest + the shared
  #     INGEST_BEARER_TOKEN (the SAME token NG sends and Scarlet verifies).
  # - reads:   the purple-report's /alerts + /logs queries ride the
  #     ADMIN-class API_BEARER_TOKEN (the scoped ingest token cannot read
  #     by design). Read-only usage, same operator, no new credentials.
  # Receipts land in the ns_fleet_runs volume (shared by the one-shot
  # neuralstrike containers: the bench writes, the purple-report reads).
  neuralstrike:
    build:
      context: ../../../NeuralStrike
      dockerfile: Dockerfile
    profiles:
      - bench
    volumes:
      - ns_fleet_runs:/data/runs
    environment:
      # The attack surface: the fleet firewall itself (in-network, :8000).
      - NEURALSTRIKE_NEURALGUARD_URL=http://neuralguard:8000
      - NEURALSTRIKE_NEURALGUARD_API_KEY=${NEURALGUARD_AUTH_API_KEYS:?set NEURALGUARD_AUTH_API_KEYS in deploy/fleet/.env}
      - NEURALSTRIKE_NEURALGUARD_TENANT=${NEURALSTRIKE_NEURALGUARD_TENANT:-default}
      # Exercise telemetry (opt-in for the bench; the fleet exercise is
      # telemetry-ON by definition — that is the purple loop's point).
      - NEURALSTRIKE_SCARLETAI_URL=http://api:8000/api/v1/ingest
      - NEURALSTRIKE_SCARLETAI_TOKEN=${INGEST_BEARER_TOKEN:?set INGEST_BEARER_TOKEN in deploy/fleet/.env}
      - NEURALSTRIKE_TELEMETRY_ACTOR=${NEURALSTRIKE_TELEMETRY_ACTOR:-neuralstrike-operator}
      # The purple-report read path (admin-class; /alerts + /logs only).
      - NEURALSTRIKE_SCARLETAI_BASE_URL=http://api:8000
      - NEURALSTRIKE_SCARLETAI_API_TOKEN=${API_BEARER_TOKEN:?set API_BEARER_TOKEN in deploy/fleet/.env}
      # The bench needs no LLM (canonical payloads, deterministic oracles):
      # skip the startup model-reachability check inside the container.
      - NEURALSTRIKE_SKIP_REACHABILITY_CHECK=true
      - NEURALSTRIKE_REDACT_LOGS=true
    depends_on:
      neuralguard:
        condition: service_healthy
      api:
        condition: service_healthy
    # One-shot by default: every real run is `docker compose run --rm
    # neuralstrike <cmd>` — no long-lived attacker process in the fleet.
    command: ["--help"]

volumes:
  ng_fleet_audit:
  ns_fleet_runs: