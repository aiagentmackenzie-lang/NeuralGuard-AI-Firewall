# Dependabot keeps pinned GitHub Actions and Python dependencies current.
# Actions are pinned to SHAs in the workflows (supply-chain hardening);
# Dependabot opens PRs to bump those SHAs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
  # Base images are digest-pinned in the Dockerfile so a signed image cannot
  # silently rebuild on a different base. Dependabot keeps the digests current;
  # note that it parses FROM lines, so the uv image in `COPY --from=` may need
  # bumping by hand (the workflow header documents how to re-resolve it).
  # Majors are ignored on purpose: this project tests Python 3.11 and 3.12, so a
  # bot proposing `3.15-slim` (which it did, immediately) is noise, not a bump.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "ghcr.io/astral-sh/uv"
        update-types:
          - "version-update:semver-major"
