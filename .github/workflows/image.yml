name: Image

# Publishes the NeuralGuard container image to GHCR, signs it keyless with
# cosign, attests its dependency SBOM, and proves what it produced.
#
# Triggers:
#   - push of a `v*` tag  → the release path. Asserts the tag equals the
#     pyproject version, then publishes `<version>`, `sha-<short>` and `latest`.
#   - workflow_dispatch   → publish the current commit under `<version>` and
#     `sha-<short>`; no `latest`, because latest means "a released tag".
#     Pass `digest` to sign/attest an ALREADY-PUBLISHED image instead of
#     building: that is how a release gets a missing signature or attestation
#     repaired without moving its tag.
#
# Cut the tag only from a green `main` — the image is the artifact a consumer
# actually runs, so the gate must already be green on the commit it came from.
#
# What is verifiable, and by whom (this is why the job checks three things):
#   - the signature            → `cosign verify` (identity-scoped)
#   - the CycloneDX SBOM       → `cosign verify-attestation --type cyclonedx`
#   - buildx provenance + SPDX SBOM
#         These are attached to the image *index* as attestation-manifests
#         (`vnd.docker.reference.type=attestation-manifest`), which the
#         **referrers API does not list** — so cosign cannot verify them, and a
#         job that pretends otherwise fails on a correct image. They are checked
#         structurally against the registry instead.
#
# The digest this workflow prints is the identity to pin in
# `deploy/kubernetes/deployment.yaml` — a tag is mutable, a digest is not.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      digest:
        description: "Existing digest to sign + attest instead of building (sha256:...)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Two publishes racing on one tag would leave a stale signature next to a
# replaced digest. Serialise per ref; do not cancel a publish mid-flight.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ── Airgapped boot smoke ───────────────────────────────────────────────
  # Regression guard for the defect the first publish attempt found: the image
  # ran `uv run`, which re-resolved dependencies AT CONTAINER START and needed
  # DNS. A security gateway must boot with no egress, so the image is built for
  # one platform, loaded locally, started with `--network none`, and health
  # checked from inside.
  smoke:
    name: Boot smoke (airgapped container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' || inputs.digest == '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build (amd64, loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: neuralguard:smoke
          cache-from: type=gha,scope=ng-image

      - name: Start with no network and wait for health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ng-smoke --network none neuralguard:smoke
          for i in $(seq 1 40); do
            if docker exec ng-smoke curl -fsS http://127.0.0.1:8000/v1/health > /tmp/health.json 2>/dev/null; then
              echo "healthy after ${i}s"; cat /tmp/health.json; break
            fi
            sleep 1
          done
          docker exec ng-smoke curl -fsS http://127.0.0.1:8000/v1/health

      - name: Assert no runtime package resolution
        shell: bash
        run: |
          set -euo pipefail
          docker logs ng-smoke > /tmp/ng.log 2>&1 || true
          if grep -qE "^Installed [0-9]+ packages|error resolving DNS" /tmp/ng.log; then
            echo "::error::the container resolved dependencies at runtime — the entrypoint must not use 'uv run'"
            grep -nE "^Installed [0-9]+ packages|error resolving DNS" /tmp/ng.log
            exit 1
          fi
          grep -q "Application startup complete" /tmp/ng.log
          echo "airgapped boot OK: no resolver, no egress"

      - name: Tear down
        if: always()
        shell: bash
        run: docker rm -f ng-smoke || true

  # ── Build + push ───────────────────────────────────────────────────────
  build:
    name: Build + push image (amd64, arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [smoke]
    # A job whose `needs` were skipped is skipped too unless it opts back in —
    # which is why the digest-repair path needs !cancelled() rather than a plain
    # condition (verified the hard way: the first repair run skipped everything).
    if: ${{ !cancelled() && needs.smoke.result == 'success' && (github.event_name == 'push' || inputs.digest == '') }}
    permissions:
      contents: read
      packages: write  # push to GHCR with GITHUB_TOKEN
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Resolve version + tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/neuralguard"
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SHORT=${GITHUB_SHA::7}

          # A release tag that disagrees with pyproject would publish an image
          # whose `version` label lies. Refuse instead of publishing it.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match pyproject version v$VERSION"
              exit 1
            fi
          fi

          TAGS="$IMAGE:$VERSION,$IMAGE:sha-$SHORT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi

          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Building $TAGS"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Index-embedded attestations (see the header for how they are checked).
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ng-image
          cache-to: type=gha,mode=max,scope=ng-image
          labels: |
            org.opencontainers.image.title=NeuralGuard
            org.opencontainers.image.description=LLM guard / AI application firewall: layered fail-closed prompt-injection defense, Agent Guardian, MCP gateway, appliance proxy.
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Publish digest to the run summary
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}"
          DIGEST="${{ steps.push.outputs.digest }}"
          {
            echo "### Image digest"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Pin it in \`deploy/kubernetes/deployment.yaml\`:"
            echo
            echo '```yaml'
            echo "image: $IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Sign + attest + verify (keyless, GitHub OIDC) ─────────────────────
  sign:
    name: Sign + attest + verify image (keyless cosign)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [smoke, build]
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.digest != '') }}
    permissions:
      contents: read
      packages: write   # cosign writes the signature + attestations to GHCR
      id-token: write   # keyless signing via GitHub OIDC (Fulcio)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Resolve owner + digest
        id: img
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          DIGEST="${{ inputs.digest || needs.build.outputs.digest }}"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::not a digest: '$DIGEST'"
            exit 1
          fi
          {
            echo "image=ghcr.io/$OWNER/neuralguard"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"
          echo "signing ${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          cosign-release: 'v3.0.6'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the SBOM (same extras the image installs)
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --no-dev --extra db --extra redis --extra tenants --extra metrics --extra semantic
          uv run pip install cyclonedx-bom
          uv run cyclonedx-py environment --output-format json --output-file sbom-image.json
          python3 -c "import json;d=json.load(open('sbom-image.json'));print('components:',len(d.get('components',[])))"

      - name: Sign the digest (not the tag)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.img.outputs.image }}@${{ steps.img.outputs.digest }}"

      - name: Attest the SBOM into the registry
        shell: bash
        run: |
          set -euo pipefail
          # A DSSE attestation, not just a buildx index manifest: this is the one
          # a consumer can verify with plain cosign.
          cosign attest --yes \
            --predicate sbom-image.json --type cyclonedx \
            "${{ steps.img.outputs.image }}@${{ steps.img.outputs.digest }}"

      - name: Verify signature (identity-scoped to this workflow)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.img.outputs.image }}@${{ steps.img.outputs.digest }}"
          IDENTITY='^https://github.com/aiagentmackenzie-lang/NeuralGuard-AI-Firewall/\.github/workflows/image\.yml@'
          cosign verify \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"

      - name: Verify the SBOM attestation (identity-scoped)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.img.outputs.image }}@${{ steps.img.outputs.digest }}"
          IDENTITY='^https://github.com/aiagentmackenzie-lang/NeuralGuard-AI-Firewall/\.github/workflows/image\.yml@'
          cosign verify-attestation --type cyclonedx \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE" > /dev/null
          echo "SBOM attestation verified (--type cyclonedx)"

      - name: Verify buildx provenance + SPDX SBOM are attached
        shell: bash
        run: |
          # These live in the image index as attestation-manifests, which the OCI
          # referrers API does not list — cosign verify-attestation cannot see
          # them, so check the registry directly rather than claiming a check
          # that would fail on a correct image.
          set -euo pipefail
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          DIGEST="${{ steps.img.outputs.digest }}"
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:$OWNER/neuralguard:pull&service=ghcr.io" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/$OWNER/neuralguard/manifests/$DIGEST" \
          | python3 -c '
          import json, sys
          doc = json.load(sys.stdin)
          att = [m for m in doc.get("manifests", [])
                 if (m.get("annotations") or {}).get("vnd.docker.reference.type") == "attestation-manifest"]
          print(f"{len(att)} buildx attestation manifest(s) attached to the index")
          if not att:
              sys.exit("::error::no buildx attestation manifests on the digest — provenance/SBOM are missing")
          '
