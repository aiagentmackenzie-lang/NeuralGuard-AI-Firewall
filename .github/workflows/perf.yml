name: Perf gate

on:
  schedule:
    # Nightly at 03:30 UTC — off-peak for shared runners.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      p95_ms:
        description: "p95 latency target (ms)"
        required: false
        default: "150"
      duration:
        description: "run duration (s)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  perf:
    name: Load/perf gate (p95 + fail-closed-under-load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Boot uvicorn
        run: |
          export NEURALGUARD_ENVIRONMENT=production
          export NEURALGUARD_AUTH_ENABLED=true
          export NEURALGUARD_AUTH_API_KEYS="perf-key-0123456789abcdef0123456789abcdef|perf"
          export NEURALGUARD_AUTH_ENFORCE_TENANT_FROM_KEY=true
          export NEURALGUARD_ALLOW_INSECURE_HTTP=true
          export NEURALGUARD_AUDIT_BACKEND=jsonl
          export NEURALGUARD_AUDIT_JSONL_PATH=/tmp/ng-perf-audit
          export NEURALGUARD_RATELIMIT_ENABLED=false
          export NEURALGUARD_WORKERS=1
          export NEURALGUARD_HOST=127.0.0.1
          export NEURALGUARD_PORT=8000
          export NEURALGUARD_SCANNER_SEMANTIC_ENABLED=false
          export NEURALGUARD_SCANNER_JUDGE_ENABLED=false
          mkdir -p /tmp/ng-perf-audit
          uv run uvicorn neuralguard.main:create_app --factory \
            --host 127.0.0.1 --port 8000 >/tmp/ng-perf.log 2>&1 &
          echo $! > /tmp/ng-perf.pid
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/v1/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8000/v1/health >/dev/null || { cat /tmp/ng-perf.log; exit 1; }

      - name: Run perf gate
        env:
          P95: ${{ github.event.inputs.p95_ms || '150' }}
          DURATION: ${{ github.event.inputs.duration || '20' }}
        run: |
          set -o pipefail
          uv run python perf/perf_gate.py \
            --base-url http://127.0.0.1:8000 \
            --key perf-key-0123456789abcdef0123456789abcdef \
            --tenant perf \
            --duration "${DURATION}" \
            --concurrency 10 \
            --p95-ms "${P95}" \
            --error-rate 0.01 | tee /tmp/perf-summary.json
          python -c "import json,sys; sys.exit(0 if json.load(open('/tmp/perf-summary.json'))['pass'] else 1)"

      - name: Tear down
        if: always()
        run: |
          if [ -f /tmp/ng-perf.pid ]; then kill "$(cat /tmp/ng-perf.pid)" 2>/dev/null || true; fi

      - name: Upload perf summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: perf-summary
          path: /tmp/perf-summary.json