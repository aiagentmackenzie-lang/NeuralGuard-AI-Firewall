name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra db

      - name: Ruff check
        run: uv run ruff check src/ tests/ perf/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ perf/

      - name: Mypy type check
        run: uv run mypy src/neuralguard/

  # ── Test ─────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra db

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short -m "not slow"

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short

      - name: Run redteam tests
        run: uv run pytest tests/redteam/ -v --tb=short

      - name: Run benchmark regression gate (A1)
        run: uv run pytest tests/benchmarks/ -v --tb=short
        # Sprint A phase A1 — labeled attack/benign corpora run against
        # /v1/evaluate in-process; asserts ASR=0% and FPR<2%. NOT the
        # nightly bench.yml (A3) — this is the per-PR regression gate.

  # ── Coverage ─────────────────────────────────────────────────────────
  coverage:
    name: Coverage gate (90%, full semantic layer)
    runs-on: ubuntu-latest
    # 30 → 90 on 2026-11-19. The multilingual model (768-dim) takes the corpus
    # rebuild from ~4 min to ~25 min on a 2-core runner, and the first run on a
    # NEW cache scope (main's own cache did not exist yet) paid export + rebuild
    # + suite in one job and was cancelled at 60. Cold-path cost is now measured
    # rather than guessed: the rebuild no longer re-embeds the survivors (a
    # bit-identical 40 % saving, verified with np.array_equal), so the ceiling
    # only has to cover a genuinely cold run.
    timeout-minutes: 90
    needs: [test]
    services:
      # P2-10 close-out: the pg audit-verify live-fire tests run in CI too —
      # "tested live on the dev Mac" is not enforcement; per-PR enforcement is.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: drillpg
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEURALGUARD_TEST_PG_URL: postgresql+asyncpg://postgres:drillpg@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (incl. semantic + semantic-export)
        # semantic-export pulls torch/optimum: heavy but REQUIRED for an
        # honest gate — without the ONNX model the semantic tests skip and
        # coverage is measured on a reduced suite (the old 86% floor's lie).
        run: uv sync --extra dev --extra db --extra tenants --extra semantic --extra semantic-export

      - name: Compute the semantic-stack fingerprint
        id: semfp
        # The cache key must name the inputs that change a VECTOR. That is
        # neither a directory (the v0.3.2 key hashed all of semantic/** and so
        # invalidated 1.1 GB for an edit to hybrid.py) nor a whole file
        # (the v0.3.3 key hashed uv.lock and settings.py, so bumping the
        # project's own version string — one line — cost two cold rebuilds,
        # measured 21 m 19 s and 30 m 14 s against a warm 7-10 min job).
        #
        # What actually moves a vector: which model, how it truncates, which
        # prefixes it was trained with, the threshold that decides which
        # paraphrases survive the benign guard, and the resolved versions of the
        # packages that tokenize or do the arithmetic. Those are read here, not
        # inferred from a file's hash.
        # tests/unit/test_ci_model_cache_key.py derives the settings list from
        # embedding.py + rebuild_corpus_vectors.py, so adding a field to the
        # vector path fails there until it is covered here.
        run: |
          uv run python - >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import tomllib
          from pathlib import Path

          from neuralguard.config.settings import ScannerSettings

          s = ScannerSettings()
          values = {
              "model": s.semantic_model,
              "max_seq_length": s.semantic_max_seq_length,
              "query_prefix": s.semantic_query_prefix,
              "passage_prefix": s.semantic_passage_prefix,
              "similarity_threshold": s.semantic_similarity_threshold,
              "escalate_floor": s.semantic_escalate_floor,
              "onnx_path": str(s.semantic_onnx_path),
              "intra_threads": s.semantic_intra_threads,
          }
          NUMERIC = {
              "onnxruntime",
              "tokenizers",
              "numpy",
              "transformers",
              "optimum",
              "optimum-onnx",
              "sentence-transformers",
              "torch",
              "safetensors",
              "huggingface-hub",
          }
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          pins = sorted(
              f"{p['name']}=={p['version']}" for p in lock["package"] if p["name"] in NUMERIC
          )
          payload = json.dumps({"values": values, "pins": pins}, sort_keys=True)
          print("fingerprint=" + hashlib.sha256(payload.encode()).hexdigest()[:16])
          PY

      - name: Restore model + vector cache
        # Keyed on everything that can change the artifacts: the corpus sources,
        # the export/rebuild scripts, the embedding engine and tokenizer
        # handling, and the derived fingerprint of the vector-input values.
        # Without this, every PR re-embeds 6,503 texts through a 768-dim model on
        # a 2-core runner (~25 min) to test code that did not touch any of it.
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            models/embedding-onnx
            models/attack_vectors.npy
            models/attack_metadata.json
          # Keyed on what actually changes the artifacts — the corpus sources,
          # the export/rebuild scripts, the embedding engine and tokenizer
          # handling, and the fingerprint above. Three over-broad versions of
          # this key have already been paid for twice over: `semantic/**` (three
          # 40-46 min cold runs), then `uv.lock` + `settings.py` (two 21-30 min
          # cold runs for a version bump). A file is not an input; the values the
          # file yields are.
          key: ng-model-${{ steps.semfp.outputs.fingerprint }}-${{ hashFiles('corpus/attack_corpus_full.jsonl', 'corpus/augment_checkpoint.jsonl', 'corpus/benign_hard_negatives.jsonl', 'benchmarks/ng_vs_ns/benign_corpus.jsonl', 'scripts/export_onnx.py', 'scripts/rebuild_corpus_vectors.py', 'src/neuralguard/semantic/embedding.py', 'src/neuralguard/semantic/hygiene.py') }}
          # NO restore-keys, deliberately. With a partial match the cache
          # action restores the nearest entry and then SKIPS saving the new one —
          # so main would restore a stale artifact, rebuild it, and never cache
          # the result, paying the cold path on every run. It did exactly that
          # three times (40-46 min each) before this was found. These artifacts
          # are only valid for the exact key: a vector set built from a different
          # model or corpus is not a near-miss, it is wrong.

      - name: Export ONNX embedding model (regenerates gitignored model artifacts)
        if: steps.model-cache.outputs.cache-hit != 'true'
        # Downloads the model named in ScannerSettings().semantic_model (no
        # --model flag: the artifact must not disagree with the runtime).
        run: uv run python scripts/export_onnx.py

      - name: Rebuild semantic corpus vectors from tracked sources
        if: steps.model-cache.outputs.cache-hit != 'true'
        # Deterministic replay of build+finalize from corpus/ (tracked);
        # the A1 gate in the suite below is the arbiter of the rebuilt corpus.
        run: uv run python scripts/rebuild_corpus_vectors.py

      - name: Verify the cached artifacts are present
        # Cheap guard against a half-written cache entry: the suite would
        # otherwise SKIP the semantic tests and quietly measure a smaller suite —
        # the exact failure mode the 90 % floor was raised to prevent.
        run: |
          test -f models/embedding-onnx/model.onnx
          test -f models/embedding-onnx/tokenizer.json
          test -f models/attack_vectors.npy

      - name: Run coverage
        run: |
          uv run pytest tests/ --cov=neuralguard --cov-report=term-missing
        # fail_under is set in pyproject.toml [tool.coverage.report] (90% —
        # CI now runs the FULL suite with the semantic model + 5.4x corpus,
        # same as local; P2 + P2-9).

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-report
          path: .coverage

  # ── Security scan ───────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra db --extra tenants

      - name: Check for known vulnerabilities
        run: |
          uv run pip-audit --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-3721
        # Blocking (no continue-on-error): a known-vulnerable runtime dep
        # fails CI. PYSEC-2026-196 / PYSEC-2026-3721 are pip *installer*
        # self-vulns; pip is not a runtime dependency and is not shipped in
        # the container (Dockerfile uses `uv sync --no-dev`, no pip) so both
        # are ignored here with justification. Runtime deps (pydantic-settings,
        # msgpack, etc.) are pinned to patched floors in pyproject.toml
        # (aiohttp>=3.14.3 covers PYSEC-2026-3545/3546/3547; the dev-only
        # corpus-builder dep datasets>=5.0.1 covers PYSEC-2026-3716 /
        # CVE-2026-66007).

  # ── SBOM ─────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra db

      - name: Install CycloneDX tool
        run: uv run pip install cyclonedx-bom

      - name: Generate SBOM (JSON)
        run: |
          uv run cyclonedx-py environment --output-format json --output-file sbom.json
          echo "SBOM generated:"
          uv run python -c "import json; d=json.load(open('sbom.json')); print(f'  Components: {len(d.get(\"components\", []))}')"

      - name: Generate SBOM (XML)
        run: |
          uv run cyclonedx-py environment --output-format xml --output-file sbom.xml

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml

  # ── SBOM signing (P2-5) ────────────────────────────────────────────────
  # Keyless cosign: the SBOM blob is SIGNED and ATTESTED (cyclonedx predicate
  # — the SBOM is CycloneDX, so spdxjson would be a false claim). Bundles are
  # uploaded so downstream consumers can verify without a registry. Image
  # signing needs a registry — documented as an ops step in
  # docs/runbooks/artifact_signing.md, not possible from CI without a push
  # target. The SBOM is regenerated here (same commit = same provenance) so
  # this job needs no artifact passing.
  sbom-sign:
    name: Sign + attest SBOM (keyless cosign)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [sbom]
    permissions:
      contents: read
      id-token: write  # keyless signing via GitHub OIDC (Fulcio)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          cosign-release: 'v3.0.6'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Regenerate SBOM (same commit as the tested tree)
        run: |
          uv sync --extra dev --extra db
          uv run pip install cyclonedx-bom
          uv run cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Sign SBOM blob (keyless)
        run: cosign sign-blob --yes --bundle sbom.json.sig.bundle sbom.json

      - name: Attest SBOM blob (keyless, cyclonedx predicate)
        run: cosign attest-blob --yes --predicate sbom.json --type cyclonedx --bundle sbom.json.attest.bundle sbom.json

      - name: Verify signature + attestation (identity-scoped)
        run: |
          IDENTITY='^https://github.com/aiagentmackenzie-lang/NeuralGuard-AI-Firewall/\.github/workflows/ci\.yml@'
          cosign verify-blob \
            --bundle sbom.json.sig.bundle \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            sbom.json
          cosign verify-blob \
            --bundle sbom.json.attest.bundle \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            sbom.json

      - name: Upload signing bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-signing-bundles
          path: |
            sbom.json.sig.bundle
            sbom.json.attest.bundle
  # ── Boot smoke ──────────────────────────────────────────────────────────
  # P0-1: actually start uvicorn against a production-shaped config and
  # exercise every endpoint over HTTP with auth. Catches env-parsing and
  # wiring regressions that the ASGI/pytest suite cannot (it already caught
  # the api_keys env-parsing bug fixed alongside this job).
  boot-smoke:
    name: Boot smoke (uvicorn + HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run boot smoke test
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh

  # ── Semantic smoke ────────────────────────────────────────────────────
  # Fast check that the [semantic] extra installs and the semantic modules
  # import cleanly, plus the model-independent semantic unit tests. The
  # FULL suite with the regenerated ONNX model + rebuilt corpus runs in the
  # `coverage` job (P2 closed 2026-09-05) — this job is the quick
  # import/install guard, not the coverage gate.
  semantic-smoke:
    name: Semantic extra smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (with semantic extra)
        run: uv sync --extra dev --extra db --extra semantic

      - name: Semantic import + similarity smoke
        run: |
          uv run python - <<'PY'
          import importlib
          # Verify the semantic modules import cleanly with the extra installed.
          importlib.import_module("neuralguard.semantic.embedding")
          importlib.import_module("neuralguard.semantic.similarity")
          importlib.import_module("neuralguard.semantic.hybrid")
          print("semantic modules import OK")
          PY

      # This job stays as a fast extra-installs + imports check. The FULL
      # semantic suite + coverage runs in the `coverage` job, which now
      # regenerates the ONNX model and rebuilds the corpus from tracked
      # sources (P2 closed 2026-09-05) — see that job for the 90% gate.

      - name: Run unit tests for semantic layer
        run: uv run pytest tests/unit/test_embedding.py tests/unit/test_similarity_scanner.py tests/unit/test_hybrid_scoring.py tests/unit/test_corpus.py -v --tb=short
