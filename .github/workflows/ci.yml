name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra db

      - name: Ruff check
        run: uv run ruff check src/ tests/ perf/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ perf/

      - name: Mypy type check
        run: uv run mypy src/neuralguard/

  # ── Test ─────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra db

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short -m "not slow"

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short

      - name: Run redteam tests
        run: uv run pytest tests/redteam/ -v --tb=short

      - name: Run benchmark regression gate (A1)
        run: uv run pytest tests/benchmarks/ -v --tb=short
        # Sprint A phase A1 — labeled attack/benign corpora run against
        # /v1/evaluate in-process; asserts ASR=0% and FPR<2%. NOT the
        # nightly bench.yml (A3) — this is the per-PR regression gate.

  # ── Coverage ─────────────────────────────────────────────────────────
  coverage:
    name: Coverage gate (86% CI-realistic)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra db

      - name: Run coverage
        run: |
          uv run pytest tests/ --cov=neuralguard --cov-report=term-missing
        # fail_under is set in pyproject.toml [tool.coverage.report] (86% — a
        # CI-realistic floor without the gitignored ONNX model; see note).

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: .coverage

  # ── Security scan ───────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra db --extra tenants

      - name: Check for known vulnerabilities
        run: |
          uv run pip-audit --ignore-vuln PYSEC-2026-196
        # Blocking (no continue-on-error): a known-vulnerable runtime dep
        # fails CI. PYSEC-2026-196 is the pip *installer* self-vuln; pip is
        # not a runtime dependency and is not shipped in the container
        # (Dockerfile uses `uv sync --no-dev`, no pip) so it is ignored
        # here with justification. Runtime deps (pydantic-settings,
        # msgpack, etc.) are pinned to patched floors in pyproject.toml.

  # ── SBOM ─────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra db

      - name: Install CycloneDX tool
        run: uv run pip install cyclonedx-bom

      - name: Generate SBOM (JSON)
        run: |
          uv run cyclonedx-py environment --output-format json --output-file sbom.json
          echo "SBOM generated:"
          uv run python -c "import json; d=json.load(open('sbom.json')); print(f'  Components: {len(d.get(\"components\", []))}')"

      - name: Generate SBOM (XML)
        run: |
          uv run cyclonedx-py environment --output-format xml --output-file sbom.xml

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml
  # ── Boot smoke ──────────────────────────────────────────────────────────
  # P0-1: actually start uvicorn against a production-shaped config and
  # exercise every endpoint over HTTP with auth. Catches env-parsing and
  # wiring regressions that the ASGI/pytest suite cannot (it already caught
  # the api_keys env-parsing bug fixed alongside this job).
  boot-smoke:
    name: Boot smoke (uvicorn + HTTP)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run boot smoke test
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh

  # ── Semantic smoke ────────────────────────────────────────────────────
  # The headline semantic/judge feature relies on gitignored ONNX model
  # artifacts, so the main test job (which doesn't install [semantic]) only
  # covers the deterministic layers. This job verifies the [semantic] extra
  # installs and the semantic modules import cleanly, and runs the semantic
  # unit tests. The model-dependent tests skip in CI (the ONNX model is
  # gitignored); they run locally after `scripts/export_onnx.py`. Full-suite
  # coverage reaches ~90%+ with the model present — see
  # PRODUCTION_HARDENING_PLAN.md (P2: regenerate the model in CI to restore a
  # 90% coverage gate).
  semantic-smoke:
    name: Semantic extra smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (with semantic extra)
        run: uv sync --extra dev --extra db --extra semantic

      - name: Semantic import + similarity smoke
        run: |
          uv run python - <<'PY'
          import importlib
          # Verify the semantic modules import cleanly with the extra installed.
          importlib.import_module("neuralguard.semantic.embedding")
          importlib.import_module("neuralguard.semantic.similarity")
          importlib.import_module("neuralguard.semantic.hybrid")
          print("semantic modules import OK")
          PY

      - name: Run unit tests for semantic layer
        run: uv run pytest tests/unit/test_embedding.py tests/unit/test_similarity_scanner.py tests/unit/test_hybrid_scoring.py tests/unit/test_corpus.py -v --tb=short
