[project]
name = "neuralguard"
version = "0.1.0"
description = "LLM Guard / AI Application Firewall — defensive middleware for prompt injection, jailbreak detection, and agentic security"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Raphael", email = "raphael@mobiussec.com" },
]
keywords = ["llm", "security", "firewall", "prompt-injection", "owasp", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.136.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",  # 2.14.0 had GHSA-4xgf-cpjx-pc3j
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "regex>=2024.11.0",
    "structlog>=24.4.0",
    "python-dateutil>=2.9.0",
    # Pinned floors for known-vulnerable transitive deps (see pip-audit).
    "aiohttp>=3.14.3",  # 3.14.1 had PYSEC-2026-3545/3546/3547
    "idna>=3.15",
    "urllib3>=2.7.0",
    "msgpack>=1.2.1",  # 1.1.2 had GHSA-6v7p-g79w-8964 (redis transitive)
]

[project.optional-dependencies]
semantic = [
    "onnxruntime>=1.19.0",
    "tokenizers>=0.21.0",
    "numpy>=1.26.0",
]
semantic-export = [
    "sentence-transformers>=3.3.0",
    "onnxruntime>=1.19.0",
    "optimum[onnxruntime]>=1.21.0",
    "tokenizers>=0.21.0",
    "numpy>=1.26.0",
]
db = [
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
]
redis = [
    "redis>=5.2.0",
]
tenants = [
    "pyyaml>=6.0.1",
]
metrics = [
    "prometheus-client>=0.21.0",
]
all = [
    "neuralguard[semantic,db,redis,metrics,tenants]",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "cyclonedx-bom>=5.0.0",
    "pip-audit>=2.7.0",
    "prometheus-client>=0.21.0",
    "hypothesis>=6.115.0",
    "redis>=5.2.0",
    "fakeredis[lua]>=2.20.0",
    # PyYAML so the tenant-registry YAML tests run in CI (the [tenants] extra
    # is the prod opt-in; the test env must exercise both .yaml and .json
    # tenant files). 6.0.1 matches the [tenants] extra floor.
    "pyyaml>=6.0.1",
]

[project.scripts]
neuralguard = "neuralguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
addopts = "-v --tb=short"
# Make the standalone `benchmarks/` package importable from tests (the A1
# regression gate in tests/benchmarks/ imports benchmarks.ng_vs_ns.harness).
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "redteam: red-team adversarial test cases",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "perf"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF012", "RUF006", "E402", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841", "TC001", "TC002", "TC003", "B007"]
"src/neuralguard/scanners/pattern_i18n.py" = ["E402", "F401", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["neuralguard"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Third-party libs without py.typed markers — treat as untyped rather than
# blocking CI. These are stable, well-known libraries.
[[tool.mypy.overrides]]
module = ["regex", "onnxruntime", "tokenizers", "redis", "redis.*", "yaml"]
ignore_missing_imports = true

# SQLAlchemy mapped_column inference can be noisy; keep strict but allow its
# internal Any-typed helpers.
[[tool.mypy.overrides]]
module = ["sqlalchemy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["neuralguard"]
branch = true

[tool.coverage.report]
# CI-realistic floor for the full suite measured WITHOUT the gitignored
# ONNX model (the semantic tests skip when the model is absent). Observed:
# ~87.4% full-suite / ~88.6% core-only on a fresh checkout. The full suite
# reaches ~90%+ when the semantic model is present (run scripts/export_onnx.py
# locally); restoring a 90% CI gate requires regenerating the model in CI
# (tracked as P2 in PRODUCTION_HARDENING_PLAN.md). 86% gives margin for
# shared-runner variance while still gating real regressions.
fail_under = 86
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "datasets>=5.0.1",  # 4.8.5 had PYSEC-2026-3716 (CVE-2026-66007, path traversal)
]
