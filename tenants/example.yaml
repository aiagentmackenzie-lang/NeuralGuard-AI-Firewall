# Example NeuralGuard per-tenant override file (Sprint C, C1 / ROADMAP P1-2).
#
# Filename stem MUST equal `tenant_id` (this file is `example.yaml` only for
# illustration — rename to e.g. `acme.yaml` with `tenant_id: acme`).
# Supported formats: .yaml / .yml (needs `pip install neuralguard[tenants]`)
#                     .json (no extra required).
#
# Every override field is optional and defaults to None = inherit the global
# config. An empty/partial file degrades to the global default, never to an
# unsafe zero. Structural + Pattern scanners are mandatory and CANNOT be
# disabled here (they are not modelled in `scanners` for that reason).

tenant_id: example
description: "Sample tenant — copy and rename to onboard a real tenant."

# Rate-limit overrides. None = inherit NEURALGUARD_RATELIMIT_*.
# A tenant may have a HIGHER quota than the global default (enterprise tiers).
requests_per_minute: 120  # null to inherit global
burst_size: 20            # null to inherit global

# Optional-scanner overrides (tri-state: null=inherit, true=enable, false=disable).
# `true` only takes effect if the scanner is globally registered/enabled —
# a tenant cannot conjure an unregistered scanner. `false` lets a tenant
# narrow its own defense surface (logged for audit).
scanners:
  agent_guardian: null   # inherit global NEURALGUARD_AGENT_GUARDIAN_ENABLED
  semantic: false        # this tenant opts out of the semantic layer
  judge: null            # inherit global NEURALGUARD_SCANNER_JUDGE_ENABLED
# --- MCP policy (NG-8 Intent Gate + NG-10 argument constraints) -------------
# Only applies when the gateway is enabled (NEURALGUARD_MCP_ENABLED=true).
# mcp:
#   tool_rules:                 # per-tool intent: allow | deny | escalate
#     delete_file: deny
#     deploy_prod: escalate
#   method_rules:               # per-MCP-method intent
#     resources/list: allow
#   default_tool_action: allow  # set deny for a default-deny tenant
#   egress_tools: ["send_email"]  # NG-9 provenance checks apply to these only
#   agent_rules:                # NG-11: per-workload-agent NARROWING only
#     support-bot:              # agent id comes from the credential binding
#       tool_rules:
#         delete_file: deny     # may restrict what the tenant allows, never widen
#       tool_constraints:       # stacked on top of the tenant's constraints
#         read_file:
#           - argument: path
#             kind: path_prefix
#             values: ["/srv/support"]
#   default_agent_action: allow # action for callers whose agent is not listed
#                               # (set deny to enumerate your fleet strictly)
#   tool_constraints:           # NG-10: HOW a tool may be asked
#     read_file:
#       - argument: path
#         kind: required
#       - argument: path
#         kind: path_prefix
#         values: ["/srv/tenant-data"]
#     http_get:
#       - argument: url
#         kind: url_host
#         values: ["api.internal.example"]
#     run_query:
#       - argument: ""
#         kind: key_allowlist
#         values: ["query", "limit"]
#       - argument: query
#         kind: regex_deny
#         values: ['(?i)\\b(drop|truncate)\\b']
#   # Kinds: required, key_allowlist, enum, max_length, regex_deny,
#   #        path_prefix, path_glob, url_host. Absent arguments are vacuous;
#   #        add `required` when an argument must be present.
